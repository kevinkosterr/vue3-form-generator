name: Release

on:
  push:
    branches:
      - production

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: bun install
      - name: Running audit
        run: bun audit --prod
      - name: Running tests
        run: bun run test
      - name: Building
        run: bun run build
      - name: Semantic release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
