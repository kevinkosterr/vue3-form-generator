name: Setup bun
description: Install bun, Node.js, and dependencies

runs:
  using: composite
  steps:
    - name: Install bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
